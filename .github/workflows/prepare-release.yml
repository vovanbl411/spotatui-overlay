name: Prepare spotatui release

on:
  schedule:
    # Ежедневно в 05:23 UTC; расписание GitHub Actions задаётся только в UTC.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Показать план без скачивания исходников, ветки, commit и PR"
        required: false
        default: false
        type: boolean

# Права задаются отдельно для каждого job.
permissions: {}

concurrency:
  group: spotatui-release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    name: Discover, prepare and validate candidate
    if: >-
      github.repository == 'vovanbl411/spotatui-overlay' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish_ready: ${{ steps.ready.outputs.publish_ready }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      DRY_RUN: ${{ inputs.dry_run || false }}
      BASE_COMMIT: ${{ github.workflow_sha }}
      HANDOFF_NAME: spotatui-release-handoff-${{ github.run_id }}-${{ github.run_attempt }}.zip
      GENTOO_PORTAGE_IMAGE: gentoo/portage@sha256:ce69e5b771bfe9404731e846b835346c34f2c82817ac3626f13af198689a1961
      GENTOO_STAGE3_IMAGE: gentoo/stage3@sha256:d8536e52677e3efe4caf048ca588bc685bc2d24d7fdfc882de1cdc6d38c81d96
    steps:
      - name: Получить main без сохранения credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Сверить checkout с ревизией workflow
        run: test "$(git rev-parse HEAD)" = "$BASE_COMMIT"

      - name: Проверить Python-логику
        id: unit_tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Найти stable release и проверить повторную обработку
        id: discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/release_automation.py discover \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --result "$RUNNER_TEMP/release.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"

      - name: Подготовить и проверить кандидат в Gentoo
        if: steps.discovery.outputs.outcome == 'release-available' && env.DRY_RUN != 'true'
        env:
          UNIT_TESTS_RESULT: ${{ steps.unit_tests.outcome }}
        run: |
          set -eu
          docker create --name gentoo-portage "$GENTOO_PORTAGE_IMAGE" /bin/true
          cleanup() { docker rm -f gentoo-portage >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm --volumes-from gentoo-portage \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/overlay,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/runner-temp" \
            --workdir /overlay \
            --env BASE_COMMIT --env HANDOFF_NAME --env UNIT_TESTS_RESULT \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --env "SUMMARY=/runner-temp/${GITHUB_STEP_SUMMARY#"$RUNNER_TEMP/"}" \
            "$GENTOO_STAGE3_IMAGE" /bin/bash -e -c '
              echo "Install Gentoo validation tools"
              emerge --oneshot app-portage/pycargoebuild dev-util/pkgcheck
              python3 /overlay/scripts/release_automation.py prepare \
                --root /overlay --result /runner-temp/release.json \
                --output /runner-temp/candidate --base-commit "$BASE_COMMIT" \
                --handoff "/runner-temp/$HANDOFF_NAME" --summary "$SUMMARY" \
                --unit-tests "$UNIT_TESTS_RESULT"
            '

      - name: Загрузить проверенный handoff
        id: upload
        if: steps.discovery.outputs.outcome == 'release-available' && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/${{ env.HANDOFF_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Отметить handoff готовым
        id: ready
        if: steps.upload.outcome == 'success' && env.DRY_RUN != 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -eu
          python3 scripts/release_automation.py check-upload \
            --handoff "$RUNNER_TEMP/$HANDOFF_NAME" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"
          echo "- Handoff ready: artifact $ARTIFACT_ID, SHA-256 $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Draft PR
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && needs.prepare.outputs.publish_ready == 'true' &&
      !inputs.dry_run && github.repository == 'vovanbl411/spotatui-overlay' &&
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Получить точную ревизию Prepare без сохранения credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Скачать handoff текущего запуска по ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-download
          skip-decompress: true
          digest-mismatch: error

      - name: Проверить remote base и применить проверенный handoff
        id: apply
        env:
          EXPECTED_BASE: ${{ github.workflow_sha }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
        run: |
          set -eu
          remote="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)"
          test "${remote%%$'\t'*}" = "$EXPECTED_BASE" || {
            echo "main moved after preparation; refusing to publish stale candidate" >&2
            exit 1
          }
          shopt -s nullglob dotglob
          archives=("$RUNNER_TEMP/release-download/"*)
          test "${#archives[@]}" = 1 || {
            echo "Expected one downloaded handoff archive" >&2
            exit 1
          }
          python3 scripts/release_automation.py apply \
            --root "$GITHUB_WORKSPACE" --handoff "${archives[0]}" \
            --expected-base "$EXPECTED_BASE" \
            --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST" \
            --pull-request-request "$RUNNER_TEMP/pull-request.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Создать automation branch и commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          RELEASE_TAG: ${{ steps.apply.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "$BRANCH" >/dev/null 2>&1; then
            echo "Automation branch already exists; refusing to overwrite it" >&2
            exit 1
          fi
          pr_count="$(gh pr list --state all --head "$GITHUB_REPOSITORY_OWNER:$BRANCH" --json number --jq 'length')"
          if [ "$pr_count" -gt 0 ]; then
            echo "A pull request already exists for this release" >&2
            exit 1
          fi
          git switch --create "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md media-sound/spotatui
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "update: spotatui ${RELEASE_TAG}"
          askpass="$RUNNER_TEMP/git-askpass.sh"
          cat > "$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Открыть Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Content-Type: application/json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@$RUNNER_TEMP/pull-request.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls" \
            > "$RUNNER_TEMP/pull-request-response.json"
          python3 -c 'import json, os; print("Draft PR: " + json.load(open(os.environ["RUNNER_TEMP"] + "/pull-request-response.json", encoding="utf-8"))["html_url"])' >> "$GITHUB_STEP_SUMMARY"
